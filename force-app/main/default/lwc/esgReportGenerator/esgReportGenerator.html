<template>
    <div class="report-generator">
        <template if:true={reportData}>
            <div class="report-header">
                <div class="report-meta">
                    <span class="report-period">FY {reportData.periodYear} ESG Report</span>
                    <span class="generated-time">Generated by Einstein AI · {formattedDate}</span>
                </div>
            </div>

            <!-- Emission Summary -->
            <div class="report-section">
                <h3 class="section-title">🏭 Carbon Emissions Summary</h3>
                <div class="emission-grid">
                    <div class="emission-scope scope-1">
                        <div class="scope-label">Scope 1</div>
                        <div class="scope-value">{scope1Formatted}</div>
                        <div class="scope-unit">tCO₂e</div>
                    </div>
                    <div class="emission-scope scope-2">
                        <div class="scope-label">Scope 2</div>
                        <div class="scope-value">{scope2Formatted}</div>
                        <div class="scope-unit">tCO₂e</div>
                    </div>
                    <div class="emission-scope scope-3">
                        <div class="scope-label">Scope 3</div>
                        <div class="scope-value">{scope3Formatted}</div>
                        <div class="scope-unit">tCO₂e</div>
                    </div>
                    <div class="emission-scope total">
                        <div class="scope-label">Total</div>
                        <div class="scope-value">{totalFormatted}</div>
                        <div class="scope-unit">tCO₂e</div>
                    </div>
                </div>
            </div>

            <!-- AI Summary -->
            <div class="report-section">
                <h3 class="section-title">🤖 AI Executive Summary</h3>
                <div class="ai-summary">
                    <p>{reportData.aiSummary}</p>
                </div>
            </div>

            <!-- ESG Score -->
            <template if:true={reportData.overallScore}>
                <div class="report-section">
                    <h3 class="section-title">📊 ESG Score</h3>
                    <div class="score-display">
                        <div class="score-circle" style={scoreCircleStyle}>
                            <span class="score-number">{reportData.overallScore}</span>
                            <span class="score-label">/ 100</span>
                        </div>
                    </div>
                </div>
            </template>
        </template>

        <template if:false={reportData}>
            <div class="no-report">
                <p>Click "Generate AI Report" to create an Einstein-powered ESG executive summary.</p>
            </div>
        </template>
    </div>
</template>
